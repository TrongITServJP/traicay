<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chém Trái Cây</title>
<meta name="description" content="Vuốt để chém trái cây, tránh bom! Game chơi ngay trên trình duyệt, máy tính lẫn điện thoại.">
<meta property="og:title" content="Chém Trái Cây 🍉">
<meta property="og:description" content="Vuốt để chém trái cây, tránh bom! Thử xem bạn được bao nhiêu điểm.">
<meta name="theme-color" content="#3b2414">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍉</text></svg>">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1a10; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; box-sizing: border-box; text-align: center; color: #fff;
    background: radial-gradient(ellipse at center, rgba(20,10,5,.35), rgba(20,10,5,.75)); }
  .hidden { display: none !important; }
  h1 { margin: 0; font-size: clamp(44px, 10vw, 92px); line-height: 1; font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(180deg, #fff27a, #ffb21e 55%, #ff6a1e); -webkit-background-clip: text; background-clip: text;
    color: transparent; filter: drop-shadow(0 4px 0 #6b2a00) drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
  h2 { margin: 0; font-size: clamp(32px, 7vw, 56px); font-weight: 900; text-shadow: 0 4px 0 #5a2200, 0 8px 20px rgba(0,0,0,.5); }
  .sub { margin: 0; font-size: clamp(15px, 3.6vw, 20px); opacity: .92; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .big { font-size: clamp(56px, 14vw, 110px); font-weight: 900; color: #ffd23f; line-height: 1;
    text-shadow: 0 5px 0 #7a3b00, 0 10px 24px rgba(0,0,0,.5); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  button { font: inherit; font-weight: 800; font-size: clamp(17px, 4vw, 21px); color: #3b1800; border: 0; cursor: pointer;
    padding: 14px 26px; border-radius: 999px; background: linear-gradient(180deg, #ffe680, #ffb21e);
    box-shadow: 0 5px 0 #a0560a, 0 10px 20px rgba(0,0,0,.35); transition: transform .08s; touch-action: manipulation; }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #a0560a, 0 6px 14px rgba(0,0,0,.35); }
  button.alt { background: linear-gradient(180deg, #b6f07a, #5fbf2a); box-shadow: 0 5px 0 #2f6d10, 0 10px 20px rgba(0,0,0,.35); color: #133000; }
  button.ghost { background: rgba(255,255,255,.14); color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.45); }
  button small { display: block; font-size: .68em; font-weight: 600; opacity: .8; }
  .best { font-size: 15px; opacity: .85; }
  .new { color: #7dff8a; font-weight: 800; font-size: 20px; animation: pulse .8s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.12); } }
  .tips { font-size: 13.5px; opacity: .7; max-width: 440px; line-height: 1.5; }
  .corner { position: fixed; z-index: 5; width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 20px;
    background: rgba(0,0,0,.35); color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.3); }
  #muteBtn { right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  #pauseBtn { left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); }
  #pauseBtn:active { transform: translateX(-50%) translateY(2px); }
  #toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff;
    padding: 10px 18px; border-radius: 999px; font-size: 15px; z-index: 10; pointer-events: none; transition: opacity .3s; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="overlay">
  <h1>Chém Trái Cây</h1>
  <p class="sub">Vuốt thật nhanh để chém trái cây — nhớ né bom! 💣</p>
  <div class="row" style="margin-top:10px">
    <button id="btnClassic">Cổ điển<small>3 mạng, càng chơi càng khó</small></button>
    <button id="btnArcade" class="alt">Tốc độ 60 giây<small>Chém càng nhiều càng tốt</small></button>
  </div>
  <div class="best" id="menuBest"></div>
  <div class="tips">Máy tính: giữ chuột trái rồi kéo. Điện thoại: vuốt ngón tay.<br>Chém 3 quả trở lên trong một nhát để ăn combo. Để rơi trái cây ở chế độ Cổ điển sẽ mất mạng.</div>
</div>

<div id="over" class="overlay hidden">
  <h2 id="overTitle">Hết giờ!</h2>
  <div class="big" id="overScore">0</div>
  <div id="overNew" class="new hidden">🏆 Kỷ lục mới!</div>
  <div class="best" id="overBest"></div>
  <div class="row" style="margin-top:8px">
    <button id="btnAgain">Chơi lại</button>
    <button id="btnShare" class="alt">Thách bạn bè</button>
    <button id="btnMenu" class="ghost">Menu</button>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <h2>Tạm dừng</h2>
  <div class="row">
    <button id="btnResume">Tiếp tục</button>
    <button id="btnQuit" class="ghost">Về menu</button>
  </div>
</div>

<button id="pauseBtn" class="corner hidden" aria-label="Tạm dừng">⏸</button>
<button id="muteBtn" class="corner" aria-label="Bật/tắt âm thanh">🔊</button>
<div id="toast" style="opacity:0"></div>

<script>
'use strict';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const $ = id => document.getElementById(id);

const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1, G = 1000, bg = null;

// ---------- Trái cây ----------
const TYPES = [
  { id: 'dua',   r: 50, skin: '#2f8f3a', skin2: '#1b5a22', hi: '#7fd36a', rind: '#d9f2b5', flesh: '#ec3442', seed: '#1a1a1a', nSeeds: 14, juice: '#e8333f' },
  { id: 'cam',   r: 38, skin: '#f7931e', skin2: '#d26400', hi: '#ffd08a', rind: '#fff1d6', flesh: '#ffa62b', juice: '#ffa000', segments: true },
  { id: 'tao',   r: 36, skin: '#d7263d', skin2: '#8f1220', hi: '#ff8a8a', rind: '#fff4dc', flesh: '#fff1c9', seed: '#5a3311', nSeeds: 5, juice: '#fff0b8', stem: true },
  { id: 'chanh', r: 31, sx: 1.12, skin: '#8fd14f', skin2: '#4f921c', hi: '#d9ff9e', rind: '#f4ffd8', flesh: '#c9ef7a', juice: '#b5e655', segments: true },
  { id: 'kiwi',  r: 33, sx: 1.12, skin: '#8a6236', skin2: '#553818', hi: '#c49a66', rind: '#b8d56a', flesh: '#78ba34', juice: '#8fd14f', kiwi: true },
  { id: 'tlong', r: 40, skin: '#e8247a', skin2: '#9c0e52', hi: '#ff9cc8', rind: '#ff7fb5', flesh: '#fbfbf2', seed: '#111', nSeeds: 46, juice: '#f04d93', scales: true },
  { id: 'xoai',  r: 37, sx: 1.25, sy: 0.86, skin: '#ffc83a', skin2: '#ec7d16', hi: '#fff0a0', rind: '#ffe28a', flesh: '#ffb627', juice: '#ffb627' },
];

function makeSeeds(t) {
  const out = [];
  for (let i = 0; i < (t.nSeeds || 0); i++) {
    const a = rand(0, TAU), d = Math.sqrt(Math.random());
    out.push({ x: Math.cos(a) * d, y: Math.sin(a) * d });
  }
  return out;
}

function ellipse(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }

function drawSkin(c, t, r, rot) {
  c.save();
  c.rotate(rot);
  c.scale(t.sx || 1, t.sy || 1);
  if (t.scales) { // vảy thanh long
    for (let k = 0; k < 8; k++) {
      const a = k * TAU / 8;
      c.beginPath();
      c.moveTo(Math.cos(a - .28) * r * .8, Math.sin(a - .28) * r * .8);
      c.quadraticCurveTo(Math.cos(a + .1) * r * 1.05, Math.sin(a + .1) * r * 1.05, Math.cos(a + .38) * r * 1.28, Math.sin(a + .38) * r * 1.28);
      c.quadraticCurveTo(Math.cos(a + .2) * r * .95, Math.sin(a + .2) * r * .95, Math.cos(a + .26) * r * .8, Math.sin(a + .26) * r * .8);
      c.fillStyle = '#8cc63f'; c.fill();
    }
  }
  const g = c.createRadialGradient(-r * .35, -r * .38, r * .08, 0, 0, r);
  g.addColorStop(0, t.hi); g.addColorStop(.55, t.skin); g.addColorStop(1, t.skin2);
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();

  c.save(); c.clip();
  if (t.id === 'dua') {
    c.strokeStyle = 'rgba(20,70,25,.85)'; c.lineWidth = r * .14; c.lineCap = 'round';
    for (let i = -3; i <= 3; i++) {
      const x = i * r * .3;
      c.beginPath(); c.moveTo(x * .6, -r);
      c.bezierCurveTo(x * 1.3 + r * .1, -r * .4, x * 1.3 - r * .1, r * .4, x * .6, r);
      c.stroke();
    }
  } else if (t.scales) {
    for (let k = 0; k < 6; k++) {
      const a = k * TAU / 6 + .5;
      c.fillStyle = 'rgba(140,198,63,.75)';
      ellipse(c, Math.cos(a) * r * .55, Math.sin(a) * r * .55, r * .2, r * .07, a + 1.2); c.fill();
    }
  } else if (t.kiwi) {
    c.fillStyle = 'rgba(50,30,10,.35)';
    for (let k = 0; k < 16; k++) { const a = k * 2.4, d = (k % 5 + 1) / 6 * r; ellipse(c, Math.cos(a) * d, Math.sin(a) * d, r * .04, r * .04); c.fill(); }
  } else if (t.segments) {
    c.fillStyle = 'rgba(0,0,0,.08)';
    for (let k = 0; k < 18; k++) { const a = k * 2.1, d = (k % 6 + 1) / 7 * r; ellipse(c, Math.cos(a) * d, Math.sin(a) * d, r * .035, r * .035); c.fill(); }
  }
  c.restore();

  if (t.stem) {
    c.strokeStyle = '#5a3311'; c.lineWidth = r * .1; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, -r * .82); c.quadraticCurveTo(r * .02, -r * 1.1, r * .12, -r * 1.25); c.stroke();
    c.fillStyle = '#4caf3a'; ellipse(c, r * .36, -r * 1.05, r * .26, r * .12, -.5); c.fill();
  }
  if (t.id === 'xoai') { c.fillStyle = '#6a8f22'; ellipse(c, -r * .82, -r * .2, r * .1, r * .07); c.fill(); }
  if (t.id === 'cam') { c.fillStyle = '#5f8f2a'; ellipse(c, 0, -r * .9, r * .1, r * .06); c.fill(); }

  c.fillStyle = 'rgba(255,255,255,.28)';
  ellipse(c, -r * .38, -r * .42, r * .26, r * .14, -.7); c.fill();
  c.restore();
}

function drawFace(c, t, r, seeds) {
  const rx = r * .98 * ((t.sx || 1) + (t.sy || 1)) / 2, ry = rx * .4;
  c.fillStyle = t.rind; ellipse(c, 0, 0, rx, ry); c.fill();
  c.fillStyle = t.flesh; ellipse(c, 0, 0, rx * .86, ry * .82); c.fill();
  if (t.segments) {
    c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = Math.max(1, r * .035);
    for (let k = 0; k < 10; k++) {
      const a = k * TAU / 10;
      c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * rx * .84, Math.sin(a) * ry * .8); c.stroke();
    }
    c.fillStyle = 'rgba(255,255,255,.7)'; ellipse(c, 0, 0, rx * .1, ry * .1); c.fill();
  }
  if (t.kiwi) {
    c.fillStyle = '#eef4cf'; ellipse(c, 0, 0, rx * .26, ry * .26); c.fill();
    c.fillStyle = '#151515';
    for (let k = 0; k < 18; k++) { const a = k * TAU / 18; ellipse(c, Math.cos(a) * rx * .45, Math.sin(a) * ry * .45, r * .035, r * .02, a); c.fill(); }
  }
  if (seeds && seeds.length) {
    c.fillStyle = t.seed;
    const sr = t.id === 'tlong' ? r * .022 : r * .045;
    for (const s of seeds) { ellipse(c, s.x * rx * .68, s.y * ry * .62, sr * 1.3, sr * .8); c.fill(); }
  }
  c.fillStyle = 'rgba(255,255,255,.18)'; ellipse(c, -rx * .3, -ry * .3, rx * .3, ry * .22); c.fill();
}

function drawBomb(b, now) {
  const r = b.r;
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
  const pulse = .5 + .5 * Math.sin(now / 90);
  ctx.shadowColor = 'rgba(255,40,30,.9)'; ctx.shadowBlur = (12 + 14 * pulse) * S;
  const g = ctx.createRadialGradient(-r * .3, -r * .35, r * .05, 0, 0, r);
  g.addColorStop(0, '#7a7a88'); g.addColorStop(.45, '#2b2b34'); g.addColorStop(1, '#09090c');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#3d3d47'; ctx.fillRect(-r * .24, -r * 1.12, r * .48, r * .3);
  ctx.strokeStyle = '#c9a26b'; ctx.lineWidth = r * .09; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -r * 1.1); ctx.quadraticCurveTo(r * .1, -r * 1.45, r * .4, -r * 1.42); ctx.stroke();
  ctx.fillStyle = `rgba(255,${180 + 60 * pulse | 0},60,1)`;
  ctx.beginPath(); ctx.arc(r * .42, -r * 1.42, r * (.1 + .08 * pulse), 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,60,50,.9)'; ctx.lineWidth = r * .12;
  ctx.beginPath(); ctx.moveTo(-r * .28, -r * .28); ctx.lineTo(r * .28, r * .28); ctx.moveTo(r * .28, -r * .28); ctx.lineTo(-r * .28, r * .28); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ellipse(ctx, -r * .38, -r * .42, r * .22, r * .12, -.7); ctx.fill();
  ctx.restore();
}

// ---------- Nền gỗ ----------
function buildBg() {
  bg = document.createElement('canvas');
  bg.width = W * DPR; bg.height = H * DPR;
  const b = bg.getContext('2d'); b.scale(DPR, DPR);
  const pw = Math.max(90, W / 7);
  const tones = ['#6b4226', '#5c3920', '#744929', '#613c21'];
  for (let x = 0, i = 0; x < W; x += pw, i++) {
    const g = b.createLinearGradient(x, 0, x + pw, 0);
    g.addColorStop(0, tones[i % 4]); g.addColorStop(.5, tones[(i + 2) % 4]); g.addColorStop(1, tones[i % 4]);
    b.fillStyle = g; b.fillRect(x, 0, pw, H);
    b.strokeStyle = 'rgba(30,14,4,.2)'; b.lineWidth = 1.2;
    for (let j = 0; j < 12; j++) {
      const gx = x + rand(4, pw - 4);
      b.beginPath(); b.moveTo(gx, 0);
      b.bezierCurveTo(gx + rand(-12, 12), H * .33, gx + rand(-12, 12), H * .66, gx + rand(-6, 6), H);
      b.stroke();
    }
    if (Math.random() < .6) {
      const kx = x + rand(pw * .25, pw * .75), ky = rand(0, H);
      b.fillStyle = 'rgba(35,16,5,.35)'; ellipse(b, kx, ky, 7, 16); b.fill();
      b.strokeStyle = 'rgba(35,16,5,.25)'; ellipse(b, kx, ky, 12, 26); b.stroke();
    }
    b.fillStyle = 'rgba(15,6,0,.55)'; b.fillRect(x, 0, 3, H);
    b.fillStyle = 'rgba(255,220,170,.06)'; b.fillRect(x + 3, 0, 2, H);
  }
  const v = b.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .25, W / 2, H / 2, Math.max(W, H) * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)');
  b.fillStyle = v; b.fillRect(0, 0, W, H);
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.max(.65, Math.min(1.35, Math.min(W, H) / 720));
  G = H * 1.15;
  buildBg();
}
addEventListener('resize', resize);
resize();

// ---------- Âm thanh ----------
let AC = null, muted = false, noiseBuf = null, lastSwoosh = 0;
try { muted = localStorage.getItem('ctc_muted') === '1'; } catch (e) {}
$('muteBtn').textContent = muted ? '🔇' : '🔊';
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function noise(dur, type, f0, f1, vol, q = 1) {
  if (!AC || muted) return;
  const t = AC.currentTime, src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  src.connect(f); f.connect(g); g.connect(AC.destination);
  src.start(t, Math.random() * .5); src.stop(t + dur);
}
function tone(freq0, freq1, dur, vol, type = 'sine', delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq0, t); o.frequency.exponentialRampToValueAtTime(freq1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  swoosh() { noise(.14, 'bandpass', 700, 3200, .16, 1.2); },
  slice() { noise(.12, 'highpass', 2500, 1200, .2); noise(.18, 'lowpass', 1400, 300, .3); tone(220, 70, .15, .25); },
  toss() { tone(140, 90, .1, .08); },
  boom() { noise(1.1, 'lowpass', 900, 60, .9); tone(90, 28, .9, .7); },
  miss() { tone(330, 140, .35, .18, 'triangle'); },
  combo(n) { const notes = [523, 659, 784, 1047, 1319]; for (let i = 0; i < Math.min(n, 5); i++) tone(notes[i], notes[i] * 1.01, .18, .14, 'triangle', i * .07); },
};

// ---------- Trạng thái ----------
let state = 'menu', mode = 'classic', paused = false;
let score = 0, lives = 3, timeLeft = 60, elapsed = 0, spawnT = 0, dieT = 0, overReason = '', menuSpawnT = 0;
let fruits = [], pieces = [], parts = [], splats = [], pops = [], queue = [], trail = [];
let flash = 0, shake = 0, down = false;
const combo = { n: 0, t: 0, x: 0, y: 0 };
const TRAIL_MS = 110;

const bestKey = m => 'ctc_best_' + m;
function getBest(m) { try { return +localStorage.getItem(bestKey(m)) || 0; } catch (e) { return 0; } }
function setBest(m, v) { try { localStorage.setItem(bestKey(m), v); } catch (e) {} }

function refreshMenuBest() {
  const a = getBest('classic'), b = getBest('arcade');
  $('menuBest').textContent = (a || b) ? `Kỷ lục — Cổ điển: ${a} · 60 giây: ${b}` : '';
}
refreshMenuBest();

function spawnOne(bomb) {
  const x = rand(W * .12, W * .88), y = H + 60 * S;
  const h = rand(.45, .82) * H, vy = -Math.sqrt(2 * G * h);
  const T = 2 * Math.sqrt(2 * h / G), vx = (rand(W * .2, W * .8) - x) / T;
  const t = bomb ? null : pick(TYPES);
  fruits.push({ t, bomb, x, y, vx, vy, r: (bomb ? 34 : t.r) * S, rot: rand(0, TAU), vr: rand(-3, 3), seeds: t ? makeSeeds(t) : null, dead: false });
  sfx.toss();
}

function spawnWave() {
  const arcade = mode === 'arcade', lvl = Math.min(1, elapsed / (arcade ? 50 : 120));
  const n = 1 + Math.floor(Math.random() * (1 + (arcade ? 4 : 3) * lvl + (arcade ? 1.5 : 0)));
  const bombP = elapsed < 4 ? 0 : arcade ? .1 + .1 * lvl : .05 + .17 * lvl;
  const salvo = Math.random() < .35;
  let bombs = 0;
  for (let i = 0; i < n; i++) {
    let bomb = Math.random() < bombP && bombs < 2 && (i > 0 || n === 1);
    if (n === 1 && bomb && Math.random() < .5) bomb = false;
    if (bomb) bombs++;
    queue.push({ d: salvo ? i * .16 : rand(0, .1), bomb });
  }
}

function startGame(m) {
  audio();
  mode = m; state = 'play'; paused = false;
  score = 0; lives = 3; timeLeft = 60; elapsed = 0; spawnT = .7;
  fruits = []; queue = []; combo.n = 0;
  $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('pause').classList.add('hidden');
  $('pauseBtn').classList.remove('hidden');
}

function endGame(reason) {
  if (state !== 'play') return;
  state = 'dying'; overReason = reason;
  dieT = reason === 'bomb' ? 1.5 : 1;
  queue = [];
  $('pauseBtn').classList.add('hidden');
}

function showOver() {
  state = 'over';
  const best = getBest(mode), isNew = score > best;
  if (isNew) setBest(mode, score);
  $('overTitle').textContent = overReason === 'bomb' ? 'Bùm! Trúng bom 💥' : overReason === 'time' ? 'Hết giờ! ⏰' : 'Hết mạng! 💔';
  $('overScore').textContent = score;
  $('overNew').classList.toggle('hidden', !isNew || score === 0);
  $('overBest').textContent = `Kỷ lục ${mode === 'classic' ? 'Cổ điển' : '60 giây'}: ${Math.max(best, score)}`;
  $('over').classList.remove('hidden');
}

function toMenu() {
  state = 'menu'; paused = false; queue = [];
  $('over').classList.add('hidden'); $('pause').classList.add('hidden'); $('pauseBtn').classList.add('hidden');
  $('menu').classList.remove('hidden');
  refreshMenuBest();
}

function setPaused(p) {
  if (state !== 'play') return;
  paused = p;
  $('pause').classList.toggle('hidden', !p);
}

function pop(text, x, y, color = '#ffd23f', size = 30) {
  pops.push({ text, x, y, color, size: size * S, life: 1.1, max: 1.1 });
}

function addSplat(x, y, r, color) {
  const blobs = [];
  for (let i = 0; i < 9; i++) {
    const a = rand(0, TAU), d = rand(0, r * 1.1);
    blobs.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, r: rand(r * .15, r * .5) });
  }
  splats.push({ x, y, color, blobs, life: 4, max: 4 });
  if (splats.length > 40) splats.shift();
}

function cut(f, ang) {
  f.dead = true;
  const playing = state === 'play';
  if (f.bomb) { explode(f); return; }
  const t = f.t, nx = -Math.sin(ang), ny = Math.cos(ang), k = 90 * S, tx = Math.cos(ang) * 40 * S, ty = Math.sin(ang) * 40 * S;
  for (const side of [-1, 1]) {
    pieces.push({
      t, r: f.r, seeds: f.seeds, side, x: f.x, y: f.y,
      vx: f.vx + nx * k * side + tx * .3, vy: Math.min(f.vy, 0) * .5 + ny * k * side + ty * .3,
      rot: ang, skinRot: f.rot - ang, vr: side * rand(1.5, 3.5),
    });
  }
  for (let i = 0; i < 16; i++) {
    const a = rand(0, TAU), sp = rand(80, 380) * S;
    parts.push({ x: f.x, y: f.y, vx: Math.cos(a) * sp + f.vx * .3, vy: Math.sin(a) * sp - 60 * S, r: rand(2, 6) * S, color: t.juice, life: rand(.4, .8), max: .8, g: 1 });
  }
  addSplat(f.x, f.y, f.r * 1.1, t.juice);
  sfx.slice();
  if (playing) {
    score++;
    combo.n++; combo.t = .28; combo.x = f.x; combo.y = f.y;
  }
}

function explode(b) {
  sfx.boom();
  flash = 1; shake = 22 * S;
  for (let i = 0; i < 50; i++) {
    const a = rand(0, TAU), sp = rand(100, 700) * S;
    parts.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rand(3, 9) * S,
      color: pick(['#ffdd55', '#ff8a1e', '#ff4b1e', '#555', '#888']), life: rand(.5, 1.2), max: 1.2, g: .4 });
  }
  addSplat(b.x, b.y, b.r * 1.8, 'rgba(10,10,10,.9)');
  if (state !== 'play') return;
  if (mode === 'classic') { endGame('bomb'); }
  else {
    score = Math.max(0, score - 10);
    pop('-10', b.x, b.y, '#ff5a4a', 40);
  }
}

function loseLife(x) {
  lives--;
  sfx.miss();
  pop('✕', Math.max(30, Math.min(W - 30, x)), H - 50 * S, '#ff4a4a', 46);
  if (lives <= 0) endGame('lives');
}

// ---------- Nhập liệu (chuột / cảm ứng) ----------
function segDist(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - a.x) * dx + (py - a.y) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
}

function addPoint(x, y, time) {
  const p = { x, y, t: time };
  const a = trail[trail.length - 1];
  trail.push(p);
  if (!a) return;
  const dx = x - a.x, dy = y - a.y, len = Math.hypot(dx, dy), dt = Math.max(1, time - a.t);
  if (len < 2 || len / dt < .22) return;
  if (len / dt > 1.1 && time - lastSwoosh > 170) { lastSwoosh = time; sfx.swoosh(); }
  const ang = Math.atan2(dy, dx);
  for (const f of fruits) {
    if (!f.dead && segDist(f.x, f.y, a, p) < f.r * ((f.t && f.t.sx) || 1)) cut(f, ang);
  }
}

cv.addEventListener('pointerdown', e => {
  audio();
  if (paused) return;
  down = true; trail = [];
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  addPoint(e.clientX, e.clientY, performance.now());
});
cv.addEventListener('pointermove', e => {
  if (!down || paused) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) addPoint(ev.clientX, ev.clientY, performance.now());
});
const up = () => { down = false; };
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', e => e.preventDefault());

$('btnClassic').onclick = () => startGame('classic');
$('btnArcade').onclick = () => startGame('arcade');
$('btnAgain').onclick = () => startGame(mode);
$('btnMenu').onclick = toMenu;
$('btnResume').onclick = () => setPaused(false);
$('btnQuit').onclick = toMenu;
$('pauseBtn').onclick = () => setPaused(true);
$('muteBtn').onclick = () => {
  muted = !muted; audio();
  $('muteBtn').textContent = muted ? '🔇' : '🔊';
  try { localStorage.setItem('ctc_muted', muted ? '1' : '0'); } catch (e) {}
};
$('btnShare').onclick = async () => {
  const url = location.href.split('#')[0];
  const text = `Mình vừa chém được ${score} điểm ở chế độ ${mode === 'classic' ? 'Cổ điển' : '60 giây'} trong game Chém Trái Cây 🍉🔪 Thử vượt qua xem!`;
  if (navigator.share) { try { await navigator.share({ title: 'Chém Trái Cây', text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text + ' ' + url); toast('Đã copy lời thách đấu, dán gửi bạn bè nhé!'); }
  catch (e) { toast(url); }
};
addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') setPaused(!paused);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });

let toastTimer = 0;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, 2400);
}

// ---------- Vòng lặp ----------
function update(dt, now) {
  if (state === 'play') {
    elapsed += dt;
    if (mode === 'arcade') { timeLeft -= dt; if (timeLeft <= 0) { timeLeft = 0; endGame('time'); } }
    spawnT -= dt;
    if (spawnT <= 0 && queue.length === 0) {
      spawnWave();
      spawnT = mode === 'arcade' ? Math.max(.55, 1.25 - elapsed * .012) : Math.max(.75, 2.1 - elapsed * .012);
    }
    for (let i = queue.length - 1; i >= 0; i--) {
      queue[i].d -= dt;
      if (queue[i].d <= 0) { spawnOne(queue[i].bomb); queue.splice(i, 1); }
    }
  } else if (state === 'menu' || state === 'over') {
    menuSpawnT -= dt;
    if (menuSpawnT <= 0 && fruits.length < 4) { spawnOne(false); menuSpawnT = rand(.9, 1.6); }
  } else if (state === 'dying') {
    dieT -= dt;
    if (dieT <= 0) showOver();
  }

  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    f.vy += G * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
    if (f.bomb && !f.dead && Math.random() < .6) {
      const c = Math.cos(f.rot), s = Math.sin(f.rot), lx = f.r * .42, ly = -f.r * 1.42;
      parts.push({ x: f.x + lx * c - ly * s, y: f.y + lx * s + ly * c, vx: rand(-60, 60) * S, vy: rand(-120, -20) * S,
        r: rand(1.5, 3) * S, color: pick(['#ffe36b', '#ffb21e', '#fff']), life: rand(.15, .35), max: .35, g: .2 });
    }
    if (f.dead || (f.vy > 0 && f.y > H + f.r * 2.5)) {
      if (!f.dead && !f.bomb && state === 'play' && mode === 'classic') loseLife(f.x);
      fruits.splice(i, 1);
    }
  }
  for (let i = pieces.length - 1; i >= 0; i--) {
    const p = pieces[i];
    p.vy += G * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.y > H + p.r * 3) pieces.splice(i, 1);
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.vy += G * p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .985;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = splats.length - 1; i >= 0; i--) if ((splats[i].life -= dt) <= 0) splats.splice(i, 1);
  for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.life -= dt; p.y -= 40 * S * dt; if (p.life <= 0) pops.splice(i, 1); }

  if (combo.n > 0) {
    combo.t -= dt;
    if (combo.t <= 0) {
      if (combo.n >= 3 && state === 'play') {
        score += combo.n;
        pop(`Combo ${combo.n} quả! +${combo.n}`, Math.max(120 * S, Math.min(W - 120 * S, combo.x)), combo.y - 30 * S, '#7dff8a', 34);
        sfx.combo(combo.n);
      }
      combo.n = 0;
    }
  }
  while (trail.length && now - trail[0].t > TRAIL_MS) trail.shift();
  flash = Math.max(0, flash - dt * 1.6);
  shake = Math.max(0, shake - dt * 40);
}

function heart(x, y, s, filled) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * .3);
  ctx.bezierCurveTo(x, y, x - s * .5, y - s * .05, x - s * .5, y + s * .3);
  ctx.bezierCurveTo(x - s * .5, y + s * .6, x - s * .1, y + s * .75, x, y + s);
  ctx.bezierCurveTo(x + s * .1, y + s * .75, x + s * .5, y + s * .6, x + s * .5, y + s * .3);
  ctx.bezierCurveTo(x + s * .5, y - s * .05, x, y, x, y + s * .3);
  ctx.fillStyle = filled ? '#ff3b5c' : 'rgba(0,0,0,.35)'; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = filled ? '#fff' : 'rgba(255,255,255,.4)'; ctx.stroke();
}

function text(str, x, y, size, color, align = 'left') {
  ctx.font = `900 ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * .18; ctx.strokeStyle = 'rgba(40,15,0,.85)';
  ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function render(now) {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  ctx.drawImage(bg, -30, -30, W + 60, H + 60);

  for (const s of splats) {
    ctx.globalAlpha = Math.min(1, s.life / s.max * 1.5) * .5;
    ctx.fillStyle = s.color;
    for (const b of s.blobs) { ctx.beginPath(); ctx.arc(s.x + b.x, s.y + b.y, b.r, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;

  for (const p of pieces) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    const R = p.r * 1.6;
    ctx.beginPath();
    if (p.side < 0) ctx.rect(-R, -R, 2 * R, R); else ctx.rect(-R, 0, 2 * R, R);
    ctx.clip();
    drawSkin(ctx, p.t, p.r, p.skinRot);
    drawFace(ctx, p.t, p.r, p.seeds);
    ctx.restore();
  }
  for (const f of fruits) {
    if (f.bomb) { drawBomb(f, now); continue; }
    ctx.save(); ctx.translate(f.x, f.y);
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ellipse(ctx, f.r * .15, f.r * .2, f.r, f.r * .95); ctx.fill();
    drawSkin(ctx, f.t, f.r, f.rot);
    ctx.restore();
  }
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (trail.length > 1) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 1; i < trail.length; i++) {
        const k = i / (trail.length - 1), age = Math.min(1, Math.max(0, 1 - (now - trail[i].t) / TRAIL_MS));
        ctx.lineWidth = (pass ? 5 : 15) * S * k * age + .5;
        ctx.strokeStyle = pass ? '#ffffff' : 'rgba(150,225,255,.45)';
        ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
      }
    }
  }

  for (const p of pops) {
    ctx.globalAlpha = Math.min(1, p.life / p.max * 2);
    text(p.text, p.x, p.y, p.size, p.color, 'center');
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state === 'play' || state === 'dying') {
    const m = 16, top = 14;
    text(String(score), m, top, Math.round(44 * S), '#ffd23f');
    text(`Kỷ lục: ${Math.max(getBest(mode), score)}`, m + 2, top + 50 * S, Math.round(16 * S), '#fff');
    if (mode === 'classic') {
      const hs = 30 * S;
      for (let i = 0; i < 3; i++) heart(W - m - hs * .55 - i * hs * 1.2, top + 4, hs, i < lives);
    } else {
      const sec = Math.ceil(timeLeft);
      text(`⏱ ${sec}`, W - m, top, Math.round(40 * S), sec <= 10 ? '#ff6a5a' : '#fff', 'right');
    }
  }

  if (flash > 0) { ctx.fillStyle = `rgba(255,250,235,${flash})`; ctx.fillRect(0, 0, W, H); }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (!paused) update(dt, now);
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
